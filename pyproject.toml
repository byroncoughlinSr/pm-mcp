[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-mcp"
version = "0.2.0"
description = "Model Context Protocol server for AI agents to run construction projects through every phase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
pm-mcp = "pm_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
